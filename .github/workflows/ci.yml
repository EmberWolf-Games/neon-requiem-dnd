name: CI

on:
  push:
    branches: [main, "setup/**", "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate system source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate version, manifest, and assets
        run: |
          npm run check:version
          npm run check:manifest
          npm run check:assets

      - name: Run unit tests
        run: npm test

      - name: Lint source
        run: npm run lint

      - name: Build upstream system source
        run: npm run build

      - name: Package and verify installation layout
        run: |
          npm run package
          npm run check:package
